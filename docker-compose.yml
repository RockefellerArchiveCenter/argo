services:
  db:
    image: postgres:14.4
    environment:
      - PGUSER=postgres
      - POSTGRES_USER=postgres  # name of the application database user
      - POSTGRES_PASSWORD=postgres  # name of the application database user
      - POSTGRES_DB=postgres  # name of the application database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - argodbvolume:/var/lib/postgresql/data/
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command: /var/www/argo/entrypoint.dev.sh
    environment:
      - APPLICATION_PORT=${APPLICATION_PORT:-8014}
      - DJANGO_DEBUG=1
      - DJANGO_SECRET_KEY=sx6mf&q*eifhk^(cx197+=*cuq0guy$43!+hy#g1l4orkklx\$g
      - DJANGO_STATIC_URL=/static/
      - DJANGO_ALLOWED_HOSTS=localhost,argo-web
      - ELASTICSEARCH_HOSTS=elasticsearch:9200
      - ELASTICSEARCH_INDEX=default
      - ELASTICSEARCH_CONNECTION=default
      - ELASTICSEARCH_API_KEY=
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=postgres
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres
      - SQL_HOST=db
      - SQL_PORT=5432
      - USE_X_FORWARDED_HOST=0 
      - SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      - CITATION_REPOSITORY_NAME=Rockefeller Archive Center
      - CITATION_REPOSITORY_BASEURL=https://dimes.rockarch.org/
      - CITATION_SEPARATOR=; 
      - CONFIG_SEPARATOR=,

    volumes:
      - .:/var/www/argo
    ports:
      - "${APPLICATION_PORT:-8014}:${APPLICATION_PORT:-8014}"
    depends_on:
      db:
        condition: service_healthy

  elasticsearch:
    image: elasticsearch:7.17.25
    environment:
      - node.name=elasticsearch
      - discovery.seed_hosts=elasticsearch
      - cluster.initial_master_nodes=elasticsearch
      - cluster.name=docker-cluster
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8000
      - http.cors.allow-headers=Content-Type, Access-Control-Allow-Headers, Authorization, X-Requested-With
      - http.cors.allow-credentials=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    ports:
      - 9200:9200

volumes:
  argodbvolume:
  elasticsearch:
